<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="zh-CN" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial">
  <rect id="page-bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <g id="page-header" data-pptx-bounds="72 66 1000 106">
    <rect id="title-rule" x="72" y="84" width="6" height="30" fill="#D0021B"/>
    <text x="96" y="110" font-family="SimHei, Arial" font-size="46" fill="#111111">往上追，源头都在生活方式</text>
    <text x="72" y="158" font-size="24" fill="#5A5A5A">血管壁的问题、血管里垃圾的问题，都是生活方式长期累积的结果</text>
  </g>
  <g id="branch-elasticity" data-pptx-bounds="72 210 520 250">
    <text x="72" y="244" font-family="SimHei, Arial" font-size="30" fill="#111111">弹性为什么下降</text>
    <rect id="mark-e-1" x="72" y="288" width="4" height="20" fill="#D0021B"/>
    <text x="96" y="304" font-size="24" fill="#111111">维 C 不足，胶原蛋白合成下降</text>
    <rect id="mark-e-2" x="72" y="356" width="4" height="20" fill="#D0021B"/>
    <text x="96" y="372" font-size="24" fill="#111111">年龄增长，胶原蛋白自然减少</text>
    <rect id="mark-e-3" x="72" y="424" width="4" height="20" fill="#D0021B"/>
    <text x="96" y="440" font-size="24" fill="#111111">抽烟大量消耗维 C，血管更脆</text>
  </g>
  <g id="branch-debris" data-pptx-bounds="688 210 520 250">
    <text x="688" y="244" font-family="SimHei, Arial" font-size="30" fill="#111111">垃圾为什么变多</text>
    <rect id="mark-d-1" x="688" y="288" width="4" height="20" fill="#D0021B"/>
    <text x="712" y="304" font-size="24" fill="#111111">高糖饮食，血糖长期偏高</text>
    <rect id="mark-d-2" x="688" y="356" width="4" height="20" fill="#D0021B"/>
    <text x="712" y="372" font-size="24" fill="#111111">超重、肥胖，血脂异常</text>
    <rect id="mark-d-3" x="688" y="424" width="4" height="20" fill="#D0021B"/>
    <text x="712" y="440" font-size="24" fill="#111111">斑块沉积，管腔越来越窄</text>
  </g>
  <g id="conclusion" data-pptx-bounds="72 500 1136 84">
    <rect id="conclusion-band" x="72" y="500" width="1136" height="84" fill="#D0021B" fill-opacity="0.07"/>
    <text x="640" y="552" font-size="30" fill="#111111" text-anchor="middle">全是生活方式的问题 —— 这就意味着可以干预</text>
  </g>
  <g id="disclaimer" data-pptx-bounds="72 626 900 22">

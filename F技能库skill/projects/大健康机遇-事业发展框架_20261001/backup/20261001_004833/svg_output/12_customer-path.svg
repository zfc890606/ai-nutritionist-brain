  <g id="step-partner" data-pptx-bounds="1012 294 188 182">
    <line id="seg-6" x1="1012" y1="380" x2="1200" y2="380" stroke="#D8D8D8" stroke-width="2"/>
    <circle cx="1106" cy="380" r="30" fill="#D0021B"/>
    <text x="1106" y="388" font-size="24" fill="#FFFFFF" text-anchor="middle">06</text>
    <text x="1106" y="320" font-family="SimHei, Arial" font-size="24" fill="#111111" text-anchor="middle">成伙伴</text>
    <text x="1106" y="440" font-size="18" fill="#5A5A5A" text-anchor="middle">从顾客到伙伴<tspan x="1106" dy="26">开始跟着一起做</tspan></text>

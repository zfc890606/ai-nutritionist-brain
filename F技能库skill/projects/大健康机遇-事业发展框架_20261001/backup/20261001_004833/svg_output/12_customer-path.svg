    <text x="72" y="158" font-size="24" fill="#5A5A5A">从第一句话，到一个愿意帮你说话的顾客</text>
  </g>
  <g id="step-logic" data-pptx-bounds="72 294 188 182">
    <line id="seg-1" x1="72" y1="380" x2="260" y2="380" stroke="#D8D8D8" stroke-width="2"/>
    <circle cx="166" cy="380" r="30" fill="#D0021B"/>
    <text x="166" y="388" font-size="24" fill="#FFFFFF" text-anchor="middle">01</text>
    <text x="166" y="320" font-family="SimHei, Arial" font-size="24" fill="#111111" text-anchor="middle">讲逻辑</text>
    <text x="166" y="440" font-size="18" fill="#5A5A5A" text-anchor="middle">先讲清楚原理<tspan x="166" dy="26">不直接推产品</tspan></text>
  </g>
  <g id="step-plan" data-pptx-bounds="260 294 188 182">
    <line id="seg-2" x1="260" y1="380" x2="448" y2="380" stroke="#D8D8D8" stroke-width="2"/>
    <circle cx="354" cy="380" r="30" fill="#D0021B"/>
    <text x="354" y="388" font-size="24" fill="#FFFFFF" text-anchor="middle">02</text>
    <text x="354" y="320" font-family="SimHei, Arial" font-size="24" fill="#111111" text-anchor="middle">出方案</text>
    <text x="354" y="440" font-size="18" fill="#5A5A5A" text-anchor="middle">生活方式与营养<tspan x="354" dy="26">一份可执行方案</tspan></text>
  </g>
  <g id="step-coach" data-pptx-bounds="448 294 188 182">

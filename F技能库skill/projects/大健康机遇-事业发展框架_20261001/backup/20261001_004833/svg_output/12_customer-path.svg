    <circle cx="542" cy="380" r="30" fill="#D0021B"/>
    <text x="542" y="388" font-size="24" fill="#FFFFFF" text-anchor="middle">03</text>
    <text x="542" y="320" font-family="SimHei, Arial" font-size="24" fill="#111111" text-anchor="middle">陪跑</text>
    <text x="542" y="440" font-size="18" fill="#5A5A5A" text-anchor="middle">建服务群陪跑<tspan x="542" dy="26">过程中随时调整</tspan></text>
  </g>
  <g id="step-result" data-pptx-bounds="636 294 188 182">

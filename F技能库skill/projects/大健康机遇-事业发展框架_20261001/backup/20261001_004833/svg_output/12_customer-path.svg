  <g id="step-koc" data-pptx-bounds="824 294 188 182">
    <line id="seg-5" x1="824" y1="380" x2="1012" y2="380" stroke="#D8D8D8" stroke-width="2"/>
    <circle cx="918" cy="380" r="30" fill="#D0021B"/>
    <text x="918" y="388" font-size="24" fill="#FFFFFF" text-anchor="middle">05</text>
    <text x="918" y="320" font-family="SimHei, Arial" font-size="24" fill="#111111" text-anchor="middle">成口碑</text>
    <text x="918" y="440" font-size="18" fill="#5A5A5A" text-anchor="middle">他会介绍朋友<tspan x="918" dy="26">慢慢变成 KOC</tspan></text>

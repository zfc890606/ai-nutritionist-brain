<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="zh-CN" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial">
  <rect id="page-bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <g id="page-header" data-pptx-bounds="72 66 900 106">
    <rect id="title-rule" x="72" y="84" width="6" height="30" fill="#D0021B"/>
    <text x="96" y="110" font-family="SimHei, Arial" font-size="46" fill="#111111">引流走 3.0：公域拉新，社群留存</text>
    <text x="72" y="158" font-size="24" fill="#5A5A5A">不是加好友刷屏，是用内容把需求吸过来</text>
  </g>
  <g id="step-content" data-pptx-bounds="150 286 200 220">
    <circle cx="250" cy="400" r="34" fill="#D0021B"/>
    <text x="250" y="408" font-family="Arial, SimHei" font-size="24" fill="#FFFFFF" text-anchor="middle">01</text>
    <text x="250" y="320" font-family="SimHei, Arial" font-size="32" fill="#111111" text-anchor="middle">做内容</text>
    <text x="250" y="468" font-size="18" fill="#5A5A5A" text-anchor="middle">短视频 / 图文内容</text>
    <text x="250" y="494" font-size="18" fill="#5A5A5A" text-anchor="middle">把陌生人变成关注者</text>
  </g>
  <g id="step-community" data-pptx-bounds="540 286 200 220">
    <circle cx="640" cy="400" r="34" fill="#D0021B"/>
    <text x="640" y="408" font-family="Arial, SimHei" font-size="24" fill="#FFFFFF" text-anchor="middle">02</text>
    <text x="640" y="320" font-family="SimHei, Arial" font-size="32" fill="#111111" text-anchor="middle">沉社群</text>
    <text x="640" y="468" font-size="18" fill="#5A5A5A" text-anchor="middle">把关注者放进社群</text>
    <text x="640" y="494" font-size="18" fill="#5A5A5A" text-anchor="middle">持续触达，持续信任</text>
  </g>
  <g id="step-demand" data-pptx-bounds="930 286 200 220">
    <circle cx="1030" cy="400" r="34" fill="#D0021B"/>
    <text x="1030" y="408" font-family="Arial, SimHei" font-size="24" fill="#FFFFFF" text-anchor="middle">03</text>
    <text x="1030" y="320" font-family="SimHei, Arial" font-size="32" fill="#111111" text-anchor="middle">接需求</text>
    <text x="1030" y="468" font-size="18" fill="#5A5A5A" text-anchor="middle">有人主动问健康问题</text>
    <text x="1030" y="494" font-size="18" fill="#5A5A5A" text-anchor="middle">这就是落地的起点</text>
  </g>
  <g id="takeaway" data-pptx-bounds="72 560 1136 76">
